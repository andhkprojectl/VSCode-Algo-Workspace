# config.yaml (workspace root) - global strategy configuration (TASKS.md T0.2)
# Credentials are NOT stored here - they live in VS_0002_config/.env
# (DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME, see .env.example).
